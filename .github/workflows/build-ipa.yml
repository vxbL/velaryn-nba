# Builds an unsigned Velaryn.ipa on a GitHub-hosted Mac.
# Sideloadly signs it with your own Apple ID when you install it.
# Run it from the repo's Actions tab -> "Build IPA" -> "Run workflow", then download the artifact.
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Build (Release, unsigned)
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' -type d | head -n1)
          if [ -z "$APP" ]; then
            echo "::error::No .app was produced. Products folder contains:"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "App: $APP"
          du -sh "$APP"
          ls "$APP" | head -n 50
          rm -rf Payload Velaryn.ipa
          mkdir Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          ditto -c -k --sequesterRsrc --keepParent Payload Velaryn.ipa
          SIZE=$(stat -f%z Velaryn.ipa)
          echo "IPA size: $SIZE bytes"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::Velaryn.ipa is only $SIZE bytes, so the build is broken."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Velaryn-ipa
          path: Velaryn.ipa
          compression-level: 0
          if-no-files-found: error
